name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi

      - name: Pull runtime images
        run: |
          docker pull --platform linux/amd64 postgres:16-alpine
          docker pull --platform linux/amd64 redis:7-alpine
          docker pull --platform linux/amd64 minio/minio:RELEASE.2024-12-18T13-15-44Z

      - name: Build application images
        run: |
          docker build \
            --platform linux/amd64 \
            --file apps/api/Dockerfile \
            --tag "liveboard-api:${GITHUB_REF_NAME}" \
            .
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --build-arg NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS=false \
            --file apps/web/Dockerfile \
            --tag "liveboard-web:${GITHUB_REF_NAME}" \
            .

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          bundle="liveboard-${GITHUB_REF_NAME}-linux-amd64"
          asset="${bundle}.run"
          bundle_dir="dist/${bundle}"
          lego_version="5.3.1"
          lego_archive="/tmp/lego_v${lego_version}_linux_amd64.tar.gz"

          mkdir -p "$bundle_dir"
          curl --fail --location --retry 3 \
            "https://github.com/go-acme/lego/releases/download/v${lego_version}/lego_v${lego_version}_linux_amd64.tar.gz" \
            --output "$lego_archive"
          echo "b3c71b122ee1947eacfe0b809b955647f6377239fe4bfc49f73b1a091ae1252a  $lego_archive" \
            | sha256sum --check
          tar -xzf "$lego_archive" -C "$bundle_dir" lego
          "$bundle_dir/lego" run \
            --path /tmp/liveboard-lego-cli-check \
            --email admin@example.com \
            --accept-tos \
            --domains board.example.com \
            --tls \
            --renew-days 30 \
            --no-random-sleep \
            --help >/dev/null
          "$bundle_dir/lego" run \
            --path /tmp/liveboard-lego-ip-cli-check \
            --email admin@example.com \
            --accept-tos \
            --domains 192.0.2.1 \
            --profile shortlived \
            --tls \
            --renew-days 3 \
            --no-random-sleep \
            --help >/dev/null

          docker save \
            postgres:16-alpine \
            redis:7-alpine \
            minio/minio:RELEASE.2024-12-18T13-15-44Z \
            "liveboard-api:${GITHUB_REF_NAME}" \
            "liveboard-web:${GITHUB_REF_NAME}" \
            | gzip -1 >"${bundle_dir}/images.tar.gz"

          cp docker-compose.yml "${bundle_dir}/docker-compose.yml"
          cp .env.production.example "${bundle_dir}/.env.example"
          cp infra/nginx/liveboard.conf "${bundle_dir}/nginx.conf"
          cp infra/systemd/liveboard-https-agent.service "${bundle_dir}/liveboard-https-agent.service"
          cp infra/systemd/liveboard-https-renew.service "${bundle_dir}/liveboard-https-renew.service"
          cp infra/systemd/liveboard-https-renew.timer "${bundle_dir}/liveboard-https-renew.timer"
          cp scripts/deploy-bundle.sh "${bundle_dir}/deploy.sh"
          cp scripts/liveboard-https-agent.py "${bundle_dir}/https-agent.py"
          cp scripts/liveboard-manager.sh "${bundle_dir}/manager.sh"
          chmod +x \
            "${bundle_dir}/deploy.sh" \
            "${bundle_dir}/https-agent.py" \
            "${bundle_dir}/lego" \
            "${bundle_dir}/manager.sh"

          {
            echo "release=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "platform=linux/amd64"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for image in \
              postgres:16-alpine \
              redis:7-alpine \
              minio/minio:RELEASE.2024-12-18T13-15-44Z \
              "liveboard-api:${GITHUB_REF_NAME}" \
              "liveboard-web:${GITHUB_REF_NAME}"; do
              docker image inspect \
                --format '{{.RepoTags}} {{.Id}} {{json .RepoDigests}}' \
                "$image"
            done
          } >"${bundle_dir}/manifest.txt"

          (
            cd "$bundle_dir"
            sha256sum \
              images.tar.gz \
              docker-compose.yml \
              deploy.sh \
              manager.sh \
              https-agent.py \
              lego \
              nginx.conf \
              liveboard-https-agent.service \
              liveboard-https-renew.service \
              liveboard-https-renew.timer \
              .env.example \
              manifest.txt \
              >SHA256SUMS
          )

          sh scripts/build-self-extracting-release.sh \
            scripts/liveboard-self-extract.sh \
            "$bundle_dir" \
            "dist/${asset}"
          size=$(stat -c %s "dist/${asset}")
          if [ "$size" -ge 2147483648 ]; then
            echo "Release bundle must stay below GitHub's 2 GiB per-asset limit." >&2
            exit 1
          fi

          rm -rf "$bundle_dir"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/liveboard-${GITHUB_REF_NAME}-linux-amd64.run" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
