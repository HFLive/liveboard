services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liveboard}
      POSTGRES_USER: ${POSTGRES_USER:-liveboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liveboard}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-liveboard}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-with-a-strong-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${LIVEBOARD_API_IMAGE:-liveboard-api:local}
    env_file:
      - .env
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-liveboard}:${POSTGRES_PASSWORD:-liveboard}@postgres:5432/${POSTGRES_DB:-liveboard}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
    command:
      [
        "node",
        "node_modules/prisma/build/index.js",
        "migrate",
        "deploy",
        "--schema",
        "prisma/schema.prisma",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${LIVEBOARD_API_IMAGE:-liveboard-api:local}
    env_file:
      - .env
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-liveboard}:${POSTGRES_PASSWORD:-liveboard}@postgres:5432/${POSTGRES_DB:-liveboard}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      LIVEBOARD_HTTPS_SOCKET: /run/liveboard/https-agent.sock
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - /run/liveboard:/run/liveboard
      # 数据迁移目录：导出包/导入包/维护模式状态文件。生产为
      # /opt/liveboard/migration（安装器创建并 chown 到容器运行用户）；
      # 本地开发可用 LIVEBOARD_MIGRATION_HOST_DIR 指到可写目录。
      - ${LIVEBOARD_MIGRATION_HOST_DIR:-/opt/liveboard/migration}:/data/migration
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS: ${NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS:-false}
    image: ${LIVEBOARD_WEB_IMAGE:-liveboard-web:local}
    env_file:
      - .env
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
